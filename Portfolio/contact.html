  <main>
    <section class="contact-page">
      <h1 class="fade-in">Contactez-moi</h1>
      <form
        action="https://formspree.io/f/xrbgnglb"
        method="POST"
        class="contact-form fade-in">
        <label>
          Votre nom :
          <input type="text" name="name" placeholder="Entrez votre nom" required>
        </label>
        <label>
          Votre email :
          <input type="email" name="email" placeholder="Entrez votre email" required>
        </label>
        <label>
          Votre message :
          <textarea name="message" placeholder="Votre message ici..." required></textarea>
        </label>
        <button type="submit">Envoyer</button>
      </form>
      <div class="linkedin-logo fade-in">
        <a href="https://www.linkedin.com/in/leomahe" target="_blank">
